<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2600" viewBox="0 0 1800 2600" role="img" aria-labelledby="title desc">
<title id="title">Humanizer：能力、Skill 实现方式与对我们的意义</title>
<desc id="desc">从能力、用户输入、Skill 加载、模型编辑流程、三种输出、25 类规则、使用价值到验收边界的完整说明。Skill 是 Markdown 编辑指南，规则由宿主模型按上下文执行，不是 25 个独立程序。图中列出全部 25 类规则，并说明事实核验、中文适配和实际收益仍需要验证。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#a84430" stroke-width="1.5"/></marker></defs>
<rect width="1800" height="2600" fill="#f6f4ec"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="72" y="67" font-size="21" fill="#a84430" font-weight="600" text-anchor="start">RESEARCH NOTE 008  /  HUMANIZER</text>
<text x="1728" y="67" font-size="21" fill="#5c6c62" font-weight="400" text-anchor="end">v3.0.0 · MIT · 中文研究</text>
<text x="72" y="146" font-size="57" fill="#25322e" font-weight="650" text-anchor="start">把文字编辑经验，变成可复用的 Skill。</text>
<text x="72" y="199" font-size="29" fill="#5c6c62" font-weight="400" text-anchor="start">减少 AI 模板腔，让表达更自然；提供个人样文后，进一步贴近作者自己的语气。</text>
<text x="72" y="242" font-size="24" fill="#a84430" font-weight="400" text-anchor="start">核心判断：25 类问题与修改建议，由宿主模型按上下文选用；无需每篇文章执行 25 次处理。</text>
<text x="72" y="316" font-size="23" fill="#a84430" font-weight="600" text-anchor="start">01</text>
<text x="130" y="316" font-size="34" fill="#25322e" font-weight="650" text-anchor="start">能力：在初稿完成后，加一轮有章法的编辑</text>
<rect x="72" y="342" width="390" height="163" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="95" y="387" font-size="28" fill="#25322e" font-weight="600" text-anchor="start">去掉空话与夸大</text>
<text x="95" y="433" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">删无信息的铺垫、重复结尾</text>
<text x="95" y="468" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">把宣传和模糊背书改得具体</text>
<rect x="494" y="342" width="390" height="163" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="517" y="387" font-size="28" fill="#25322e" font-weight="600" text-anchor="start">调整句式与段落</text>
<text x="517" y="433" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">减少机械排比和重复开头</text>
<text x="517" y="468" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">按实际内容组织节奏与结构</text>
<rect x="916" y="342" width="390" height="163" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="939" y="387" font-size="28" fill="#25322e" font-weight="600" text-anchor="start">匹配作者的语气</text>
<text x="939" y="433" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">参考样文的措辞、句长、标点</text>
<text x="939" y="468" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">不同文体采用不同表达方式</text>
<rect x="1338" y="342" width="390" height="163" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="1361" y="387" font-size="28" fill="#25322e" font-weight="600" text-anchor="start">嵌入写作与文件任务</text>
<text x="1361" y="433" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">用于正文、邮件、README、PR</text>
<text x="1361" y="468" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">文件模式要求保留代码与链接</text>
<text x="72" y="573" font-size="23" fill="#a84430" font-weight="600" text-anchor="start">02</text>
<text x="130" y="573" font-size="34" fill="#25322e" font-weight="650" text-anchor="start">实现：把规则放进上下文，由大模型完成改写</text>
<text x="1728" y="573" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="end">本库没有自有模型或独立改写服务</text>
<rect x="72" y="605" width="400" height="267" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="97" y="647" font-size="29" fill="#25322e" font-weight="600" text-anchor="start">你提供什么</text>
<text x="97" y="693" font-size="25" fill="#5c6c62" font-weight="400" text-anchor="start">原文：待编辑的内容</text>
<text x="97" y="736" font-size="25" fill="#5c6c62" font-weight="400" text-anchor="start">目标：读者、文体、用途</text>
<text x="97" y="779" font-size="25" fill="#5c6c62" font-weight="400" text-anchor="start">事实：需要保留的材料</text>
<text x="97" y="822" font-size="25" fill="#5c6c62" font-weight="400" text-anchor="start">样文：可选的个人写作参考</text>
<path d="M482 734 L532 734" fill="none" stroke="#a84430" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="543" y="605" width="700" height="267" rx="12" fill="#f4ebdf" stroke="#c6987d" stroke-width="2"/>
<text x="570" y="647" font-size="30" fill="#a84430" font-weight="600" text-anchor="start">Humanizer / SKILL.md</text>
<text x="570" y="693" font-size="25" fill="#5c6c62" font-weight="400" text-anchor="start">元数据：名称与描述，供宿主识别与调用</text>
<text x="570" y="736" font-size="25" fill="#5c6c62" font-weight="400" text-anchor="start">规则正文：25 类模式 + 前后示例 + 例外条件</text>
<text x="570" y="779" font-size="25" fill="#5c6c62" font-weight="400" text-anchor="start">执行要求：编辑步骤、事实约束、风格与输出</text>
<text x="570" y="822" font-size="25" fill="#5c6c62" font-weight="400" text-anchor="start">使用方式：宿主加载 Skill，将规则交给模型</text>
<path d="M1255 734 L1305 734" fill="none" stroke="#a84430" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1318" y="605" width="410" height="267" rx="12" fill="#e7ede0" stroke="#d5dccf" stroke-width="2"/>
<text x="1343" y="647" font-size="29" fill="#25322e" font-weight="600" text-anchor="start">宿主大模型执行</text>
<text x="1343" y="693" font-size="25" fill="#5c6c62" font-weight="400" text-anchor="start">理解原文和上下文</text>
<text x="1343" y="736" font-size="25" fill="#5c6c62" font-weight="400" text-anchor="start">判断哪些规则适用</text>
<text x="1343" y="779" font-size="25" fill="#5c6c62" font-weight="400" text-anchor="start">生成改写并自检</text>
<text x="1343" y="822" font-size="25" fill="#5c6c62" font-weight="400" text-anchor="start">文件读写能力由宿主提供</text>
<rect x="72" y="892" width="1656" height="100" rx="12" fill="#efeee5" stroke="#efeee5" stroke-width="2"/>
<text x="98" y="930" font-size="23" fill="#25322e" font-weight="600" text-anchor="start">配套文件只负责接入与检查</text>
<text x="98" y="966" font-size="23" fill="#5c6c62" font-weight="400" text-anchor="start">plugin.json / agents/openai.yaml：入口与展示信息；validate-package.py：检查版本、编号和包结构，不处理文章。</text>
<text x="72" y="1044" font-size="25" fill="#25322e" font-weight="600" text-anchor="start">模型内的编辑流程</text>
<text x="1728" y="1044" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="end">提示词中的步骤，不代表固定四次 API 调用</text>
<rect x="72" y="1066" width="363" height="105" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="95" y="1107" font-size="28" fill="#25322e" font-weight="600" text-anchor="start">1  标记问题</text>
<text x="95" y="1145" font-size="23" fill="#5c6c62" font-weight="400" text-anchor="start">从词句到段落识别模式</text>
<path d="M446 1118 L488 1118" fill="none" stroke="#a84430" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="503" y="1066" width="363" height="105" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="526" y="1107" font-size="28" fill="#25322e" font-weight="600" text-anchor="start">2  重写初稿</text>
<text x="526" y="1145" font-size="23" fill="#5c6c62" font-weight="400" text-anchor="start">重组表达，保留有效信息</text>
<path d="M877 1118 L919 1118" fill="none" stroke="#a84430" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="934" y="1066" width="363" height="105" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="957" y="1107" font-size="28" fill="#25322e" font-weight="600" text-anchor="start">3  复查初稿</text>
<text x="957" y="1145" font-size="23" fill="#5c6c62" font-weight="400" text-anchor="start">检查残留问题与事实增删</text>
<path d="M1308 1118 L1350 1118" fill="none" stroke="#a84430" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1365" y="1066" width="363" height="105" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="1388" y="1107" font-size="28" fill="#25322e" font-weight="600" text-anchor="start">4  写出终稿</text>
<text x="1388" y="1145" font-size="23" fill="#5c6c62" font-weight="400" text-anchor="start">围绕主旨自然表达</text>
<rect x="72" y="1191" width="1656" height="102" rx="12" fill="#e7ede0" stroke="#e7ede0" stroke-width="2"/>
<text x="97" y="1230" font-size="25" fill="#25322e" font-weight="600" text-anchor="start">贯穿全程的约束</text>
<text x="337" y="1230" font-size="25" fill="#25322e" font-weight="400" text-anchor="start">不新增无依据事实；把原文当编辑材料；有意义的修辞和引用应保留。</text>
<text x="337" y="1270" font-size="24" fill="#5c6c62" font-weight="400" text-anchor="start">弱信号结合上下文判断；作者样文可覆盖默认风格；缺少信息就提问或简化。</text>
<text x="72" y="1340" font-size="25" fill="#a84430" font-weight="600" text-anchor="start">粘贴文本</text>
<text x="72" y="1378" font-size="24" fill="#5c6c62" font-weight="400" text-anchor="start">初稿 + 简短自评 + 最终文本</text>
<text x="634" y="1340" font-size="25" fill="#a84430" font-weight="600" text-anchor="start">指定文件</text>
<text x="634" y="1378" font-size="24" fill="#5c6c62" font-weight="400" text-anchor="start">只写最终正文，再摘要说明</text>
<text x="1196" y="1340" font-size="25" fill="#a84430" font-weight="600" text-anchor="start">嵌入其他任务</text>
<text x="1196" y="1378" font-size="24" fill="#5c6c62" font-weight="400" text-anchor="start">只返回最终文本</text>
<text x="72" y="1457" font-size="23" fill="#a84430" font-weight="600" text-anchor="start">03</text>
<text x="130" y="1457" font-size="34" fill="#25322e" font-weight="650" text-anchor="start">规则：5 个类别，覆盖 25 类常见写作问题</text>
<text x="1728" y="1457" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="end">完整分类，按上游 3.0.0 编号归纳</text>
<rect x="72" y="1484" width="312" height="384" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="92" y="1526" font-size="21" fill="#a84430" font-weight="600" text-anchor="start">A / 5 类</text>
<text x="92" y="1568" font-size="27" fill="#25322e" font-weight="600" text-anchor="start">表达姿态</text>
<text x="92" y="1615" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">01  空洞的“不是…而是…”</text>
<text x="92" y="1649" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">02  重复结尾、戏剧化短句</text>
<text x="92" y="1683" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">03  貌似深刻的格言</text>
<text x="92" y="1717" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">04  进入主题前的铺垫</text>
<text x="92" y="1751" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">05  虚设反对意见</text>
<rect x="408" y="1484" width="312" height="384" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="428" y="1526" font-size="21" fill="#a84430" font-weight="600" text-anchor="start">B / 6 类</text>
<text x="428" y="1568" font-size="27" fill="#25322e" font-weight="600" text-anchor="start">机械节奏</text>
<text x="428" y="1615" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">06  强行凑三项的排比</text>
<text x="428" y="1649" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">07  连续重复句子开头</text>
<text x="428" y="1683" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">08  破折号连接一切</text>
<text x="428" y="1717" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">09  不确定修饰语堆叠</text>
<text x="428" y="1751" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">10  英文连字符滥用</text>
<text x="428" y="1785" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">11  被动语态、缺失主语</text>
<rect x="744" y="1484" width="312" height="384" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="764" y="1526" font-size="21" fill="#a84430" font-weight="600" text-anchor="start">C / 7 类</text>
<text x="764" y="1568" font-size="27" fill="#25322e" font-weight="600" text-anchor="start">夸大与权威</text>
<text x="764" y="1615" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">12  指定的 AI 高频词</text>
<text x="764" y="1649" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">13  拔高普通事实的意义</text>
<text x="764" y="1683" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">14  含糊的关联表述</text>
<text x="764" y="1717" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">15  无依据的 -ing 附加句</text>
<text x="764" y="1751" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">16  宣传式语言</text>
<text x="764" y="1785" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">17  模糊专家、媒体背书</text>
<text x="764" y="1819" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">18  回避简单动词</text>
<rect x="1080" y="1484" width="312" height="384" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="1100" y="1526" font-size="21" fill="#a84430" font-weight="600" text-anchor="start">D / 3 类</text>
<text x="1100" y="1568" font-size="27" fill="#25322e" font-weight="600" text-anchor="start">机械格式</text>
<text x="1100" y="1615" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">19  装饰性加粗与标签</text>
<text x="1100" y="1649" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">20  装饰性标题</text>
<text x="1100" y="1683" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">21  不符目标风格的引号</text>
<rect x="1416" y="1484" width="312" height="384" rx="12" fill="#fffef9" stroke="#d5dccf" stroke-width="2"/>
<text x="1436" y="1526" font-size="21" fill="#a84430" font-weight="600" text-anchor="start">E / 4 类</text>
<text x="1436" y="1568" font-size="27" fill="#25322e" font-weight="600" text-anchor="start">聊天与草稿残留</text>
<text x="1436" y="1615" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">22  聊天问候、赞美、追问</text>
<text x="1436" y="1649" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">23  知识声明与无据猜测</text>
<text x="1436" y="1683" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">24  首句重复标题</text>
<text x="1436" y="1717" font-size="20" fill="#5c6c62" font-weight="400" text-anchor="start">25  不必要的旧版本叙述</text>
<text x="72" y="1910" font-size="24" fill="#a84430" font-weight="400" text-anchor="start">25 类是编辑检查项，不是 25 个独立算法，也不是 AI 作者身份的判定标准。具体例外与说明见网页规则库。</text>
<text x="72" y="1981" font-size="23" fill="#a84430" font-weight="600" text-anchor="start">04</text>
<text x="130" y="1981" font-size="34" fill="#25322e" font-weight="650" text-anchor="start">对我们的意义：把反复提出的修改意见，变成可复用的规范</text>
<rect x="72" y="2008" width="532" height="196" rx="12" fill="#e7ede0" stroke="#e7ede0" stroke-width="2"/>
<text x="96" y="2053" font-size="27" fill="#25322e" font-weight="600" text-anchor="start">日常写作：少重复交代</text>
<text x="96" y="2100" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">把“删套话、说具体、保留信息”固化下来。</text>
<text x="96" y="2135" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">用于邮件、汇报、博客和产品说明，</text>
<text x="96" y="2170" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">减少每次从头描述编辑要求的负担。</text>
<rect x="634" y="2008" width="532" height="196" rx="12" fill="#e7ede0" stroke="#e7ede0" stroke-width="2"/>
<text x="658" y="2053" font-size="27" fill="#25322e" font-weight="600" text-anchor="start">研究整理：更容易读懂</text>
<text x="658" y="2100" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">适合本仓库研究文档的最后一轮编辑。</text>
<text x="658" y="2135" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">保留项目名、版本、commit、许可证，</text>
<text x="658" y="2170" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">以及“已验证 / 待验证”的区别。</text>
<rect x="1196" y="2008" width="532" height="196" rx="12" fill="#e7ede0" stroke="#e7ede0" stroke-width="2"/>
<text x="1220" y="2053" font-size="27" fill="#25322e" font-weight="600" text-anchor="start">团队协作：积累自己的标准</text>
<text x="1220" y="2100" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">结合团队样文与读者需求调整规则。</text>
<text x="1220" y="2135" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">把个人经验变成可讨论的编辑清单，</text>
<text x="1220" y="2170" font-size="22" fill="#5c6c62" font-weight="400" text-anchor="start">再用真实样本比较质量与修改成本。</text>
<text x="72" y="2255" font-size="24" fill="#a84430" font-weight="600" text-anchor="start">建议使用位置</text>
<text x="275" y="2255" font-size="27" fill="#25322e" font-weight="600" text-anchor="start">研究 / 写作初稿  →  Humanizer 编辑  →  人工核对事实与语气  →  文档或网页发布</text>
