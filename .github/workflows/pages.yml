name: Deploy research site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'projects/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            projects/010-veloce-bike-studio/web/package-lock.json
            projects/012-lift-chair-studio/web/package-lock.json
      - name: Check project index
        run: python scripts/projects.py check
      - name: Build static site
        run: python scripts/build_site.py
      - name: Verify 3D interaction rules
        run: |
          python scripts/test_projects.py
          node --test projects/010-veloce-bike-studio/web/tests/*.test.mjs
          node --test projects/012-lift-chair-studio/web/tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Stage public files only
        run: |
          python - <<'PY'
          import shutil
          shutil.copytree('site', '_site', ignore=shutil.ignore_patterns('*.md', '*.template.html'))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
